<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>合成 4096</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#111421;--panel:#191e30;--muted:#9ca5be;--line:#343b53;--accent:#b2f28b;--tile:#252b40}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 15%,#29314a 0,#171b2b 47%,#101320 100%);color:#f4f2eb;font-family:'Space Grotesk',system-ui,sans-serif;display:grid;place-items:center;padding:22px}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:radial-gradient(#dce9ff 1px,transparent 1px);background-size:47px 47px;mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}.shell{width:min(100%,680px);position:relative}.topline{display:flex;align-items:center;justify-content:space-between;margin:0 0 14px;padding:0 5px}.brand{font-size:11px;letter-spacing:.18em;color:#b4bdd3}.brand b{color:var(--accent)}.pill{border:1px solid #414862;border-radius:99px;padding:7px 12px;color:#adb6ce;font:10px 'DM Mono',monospace;letter-spacing:.1em}.card{border:1px solid #424960;border-radius:22px;padding:clamp(16px,4vw,30px);background:linear-gradient(145deg,rgba(34,40,61,.96),rgba(21,25,40,.98));box-shadow:0 32px 100px #080a13aa,inset 0 1px #ffffff0b}.header{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin:0 2px 21px}.title h1{margin:0;font-size:clamp(33px,8vw,58px);line-height:.94;letter-spacing:-.075em;font-weight:700}.title h1 span{color:var(--accent)}.title p{margin:11px 0 0;color:#a6afc6;font-size:13px}.scores{display:flex;gap:8px}.scorebox{min-width:88px;text-align:center;padding:9px 12px;border:1px solid #424961;border-radius:12px;background:#141829}.scorebox small{display:block;color:#9ca6bf;font:9px 'DM Mono',monospace;letter-spacing:.13em;margin-bottom:5px}.scorebox strong{font:18px 'DM Mono',monospace}.scorebox.best strong{color:var(--accent)}.toolbar{display:flex;justify-content:space-between;align-items:center;margin:0 1px 11px}.goal{font-size:12px;color:#c4cadd}.goal b{color:var(--accent);font:500 12px 'DM Mono',monospace}.new{border:1px solid #56617b;border-radius:8px;background:#30374d;color:#f4f2eb;padding:9px 13px;font:11px 'DM Mono',monospace;cursor:pointer;transition:.15s}.new:hover{border-color:var(--accent);color:var(--accent)}.boardwrap{position:relative}.board{width:100%;aspect-ratio:1;background:#101525;border:1px solid #4b536c;border-radius:15px;padding:clamp(8px,2vw,13px);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:clamp(7px,1.7vw,11px);touch-action:none;user-select:none;box-shadow:inset 0 0 35px #080b14}.cell{border-radius:10px;background:#22283a;display:grid;place-items:center;font:600 clamp(22px,7vw,45px) 'DM Mono',monospace;color:#f8f5ed;letter-spacing:-.07em;transition:transform .12s,background .12s;position:relative;overflow:hidden}.cell.filled{box-shadow:inset 0 1px #ffffff22,0 3px 8px #080a1550}.cell.newtile{animation:pop .16s ease-out}@keyframes pop{from{transform:scale(.72)}to{transform:scale(1)}}.v2{background:#e9e5db;color:#373945}.v4{background:#dbd8bd;color:#343747}.v8{background:#f0ad70;color:#382b2a}.v16{background:#ec8e62;color:#fff7ec}.v32{background:#e86e59;color:#fff8f2}.v64{background:#df5144;color:white}.v128{background:#d7bc68;color:#fffdf1;font-size:clamp(19px,6vw,37px)}.v256{background:#b9c969;color:#202b27;font-size:clamp(19px,6vw,37px)}.v512{background:#8dbb69;color:#173327;font-size:clamp(18px,5.7vw,34px)}.v1024{background:#62b99c;color:#082e2b;font-size:clamp(16px,5vw,29px)}.v2048{background:#64c8d3;color:#082e38;font-size:clamp(16px,5vw,29px)}.v4096{background:linear-gradient(135deg,#a6f18a,#63d7c9);color:#102b31;font-size:clamp(15px,4.8vw,28px);box-shadow:0 0 22px #a6f18a55!important}.overlay{position:absolute;inset:0;border-radius:15px;background:#101525d9;backdrop-filter:blur(4px);display:grid;place-items:center;text-align:center;padding:20px;transition:opacity .2s}.overlay.hide{opacity:0;pointer-events:none}.overlay h2{font-size:clamp(27px,7vw,40px);margin:0 0 8px;letter-spacing:-.05em}.overlay p{margin:0 auto 17px;color:#c1c9dc;font-size:13px;line-height:1.6;max-width:310px}.overlay .action{border:0;border-radius:9px;background:var(--accent);color:#142019;padding:12px 20px;font:600 12px 'DM Mono',monospace;cursor:pointer}.footer{display:flex;justify-content:space-between;gap:10px;margin:14px 4px 0;color:#929cb7;font:10px 'DM Mono',monospace}.footer b{color:#d4d9e7;font-weight:400}.toast{height:18px;margin:8px 3px 0;text-align:center;color:var(--accent);font:10px 'DM Mono',monospace;letter-spacing:.06em}.mobile{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,43px);gap:5px;justify-content:center;margin-top:10px}.mobile button{border:1px solid #48516a;border-radius:9px;background:#222a40;color:#e9eef9;font-size:18px;touch-action:manipulation}.mobile button:active{background:#46546a;color:var(--accent)}.mobile .up{grid-column:2}.mobile .left{grid-column:1;grid-row:2}.mobile .down{grid-column:2;grid-row:2}.mobile .right{grid-column:3;grid-row:2}@media(max-width:540px){body{padding:12px}.header{align-items:flex-start;flex-direction:column}.scores{width:100%}.scorebox{flex:1}.footer{font-size:9px}.mobile{display:grid}}
</style></head><body><main class="shell"><div class="topline"><div class="brand"><b>✦</b> TILE STUDIO</div><div class="pill">CLASSIC MODE &nbsp; / &nbsp; 4 × 4</div></div><section class="card"><header class="header"><div class="title"><h1>合成 <span>4096</span></h1><p>滑动棋盘，把相同数字合在一起。</p></div><div class="scores"><div class="scorebox"><small>当前分数</small><strong id="score">0</strong></div><div class="scorebox best"><small>最高分</small><strong id="best">0</strong></div></div></header><div class="toolbar"><div class="goal">目标数字 <b>4096</b></div><button class="new" id="restart">↻ &nbsp;重新开始</button></div><div class="boardwrap"><div class="board" id="board" role="grid" aria-label="合成4096棋盘"></div><div class="overlay hide" id="overlay"><div><h2 id="messageTitle">太棒了！</h2><p id="messageText">你合成了 4096。还想继续挑战更高数字吗？</p><button class="action" id="continue">继续游戏</button></div></div></div><div class="mobile"><button class="up" data-dir="up" aria-label="向上">↑</button><button class="left" data-dir="left" aria-label="向左">←</button><button class="down" data-dir="down" aria-label="向下">↓</button><button class="right" data-dir="right" aria-label="向右">→</button></div><div class="toast" id="toast"></div><footer class="footer"><span>移动 <b>方向键 / WASD</b> 或滑动</span><span>合并至 <b>4096</b> 即可获胜</span></footer></section></main>
<script>
(()=>{const N=4,TARGET=4096,boardEl=document.querySelector('#board'),scoreEl=document.querySelector('#score'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),toast=document.querySelector('#toast');let grid,score,best=+(localStorage.getItem('merge4096Best')||0),won,keepGoing,over,prev=0,toastTimer;bestEl.textContent=best;function fresh(){grid=Array.from({length:N},()=>Array(N).fill(0));score=0;won=false;keepGoing=false;over=false;overlay.classList.add('hide');spawn();spawn();render();toast.textContent='';}function spawn(){let empty=[];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(!grid[r][c])empty.push([r,c]);if(!empty.length)return;let [r,c]=empty[Math.floor(Math.random()*empty.length)];grid[r][c]=Math.random()<.9?2:4;grid[r][c].fresh=true}function render(){boardEl.innerHTML='';for(let r=0;r<N;r++)for(let c=0;c<N;c++){let v=grid[r][c],el=document.createElement('div');el.className='cell'+(v?' filled v'+Math.min(v,4096):'')+(v&&v.fresh?' newtile':'');el.textContent=v?Number(v):'';el.setAttribute('role','gridcell');el.setAttribute('aria-label',v?String(v):'空');boardEl.appendChild(el);if(v&&v.fresh)grid[r][c]=Number(v)}scoreEl.textContent=score;bestEl.textContent=best}function move(dir){if(over||(!overlay.classList.contains('hide')&&won&&!keepGoing))return;let before=JSON.stringify(grid),g=grid.map(row=>row.slice()),gain=0;for(let line=0;line<N;line++){let coords=[];for(let i=0;i<N;i++){let r,c;if(dir==='left'){r=line;c=i}else if(dir==='right'){r=line;c=N-1-i}else if(dir==='up'){r=i;c=line}else{r=N-1-i;c=line}coords.push([r,c])}let vals=coords.map(([r,c])=>Number(g[r][c])).filter(Boolean),merged=[];for(let i=0;i<vals.length;i++){if(vals[i]===vals[i+1]){let nv=vals[i]*2;merged.push(nv);gain+=nv;if(nv===TARGET&&!won)won=true;i++}else merged.push(vals[i])}while(merged.length<N)merged.push(0);coords.forEach(([r,c],i)=>g[r][c]=merged[i])}if(JSON.stringify(g)===before)return;grid=g;score+=gain;if(score>best){best=score;localStorage.setItem('merge4096Best',best)}spawn();render();if(won&&!keepGoing){show('合成成功！','你合成了 4096。还想继续挑战更高数字吗？','继续游戏')}else if(!canMove()){over=true;show('棋盘满了','没有可移动的方块了。再开一局，冲击更高分数吧。','再来一局')}}function canMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(!grid[r][c])return true;if(c<N-1&&Number(grid[r][c])===Number(grid[r][c+1]))return true;if(r<N-1&&Number(grid[r][c])===Number(grid[r+1][c]))return true}return false}function show(title,text,button){document.querySelector('#messageTitle').textContent=title;document.querySelector('#messageText').textContent=text;document.querySelector('#continue').textContent=button;overlay.classList.remove('hide')}document.querySelector('#continue').addEventListener('click',()=>{if(won){keepGoing=true;overlay.classList.add('hide')}else fresh()});document.querySelector('#restart').addEventListener('click',fresh);document.addEventListener('keydown',e=>{let map={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};if(map[e.key]){e.preventDefault();move(map[e.key])}});document.querySelectorAll('.mobile button').forEach(b=>b.addEventListener('click',()=>move(b.dataset.dir)));let startX=0,startY=0;boardEl.addEventListener('pointerdown',e=>{startX=e.clientX;startY=e.clientY});boardEl.addEventListener('pointerup',e=>{let dx=e.clientX-startX,dy=e.clientY-startY;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;move(Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up'))});fresh()})();
</script></body></html>
